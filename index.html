<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NabZap | Coming Soon</title>

  <meta name="description"
        content="NabZap — Discovering opportunities and moving with speed.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #090b10;
    }

    body {
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 22%,
          rgba(15, 55, 85, 0.22),
          transparent 42%
        ),
        #090b10;
    }

    .content {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 45px 24px 300px;
    }

    .logo {
      display: block;
      width: min(350px, 68vw);
      height: auto;
      margin: 0 auto 18px;
    }

    .brand {
      font-size: clamp(3.2rem, 11vw, 6rem);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
    }

    .nab {
      color: #ffffff;
    }

    .zap {
      color: #d9a63c;
    }

    .tagline {
      margin-top: 25px;
      font-size: clamp(1.3rem, 4.5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .message {
      max-width: 620px;
      margin: 18px auto 0;
      color: #aeb4c0;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      line-height: 1.6;
    }

    .values {
      margin-top: 24px;
      color: #d9a63c;
      font-size: clamp(0.68rem, 2.6vw, 0.88rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .dot {
      color: #6f7888;
      padding: 0 8px;
    }

    .coming {
      display: inline-block;
      margin-top: 30px;
      padding: 13px 30px;
      border: 1px solid rgba(217, 166, 60, 0.7);
      border-radius: 50px;
      color: #d9a63c;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 5px;
    }

    /* EARTH HORIZON */

    .horizon-container {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 250px;
      overflow: hidden;
      z-index: 1;
    }

    .horizon {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      height: auto;
      min-width: 900px;
    }

    .footer {
      position: absolute;
      left: 0;
      bottom: 14px;
      width: 100%;
      z-index: 4;
      color: #8a919d;
      font-size: 0.7rem;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .page {
        height: 100svh;
        min-height: 100svh;
      }

      .content {
        padding: 24px 18px 0;
      }

      .logo {
        width: 48vw;
        max-width: 210px;
        margin-bottom: 10px;
      }

      .brand {
        font-size: 3.2rem;
        letter-spacing: -2px;
      }

      .tagline {
        margin-top: 18px;
        font-size: 1.18rem;
      }

      .message {
        margin-top: 14px;
        max-width: 350px;
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .values {
        margin-top: 18px;
        font-size: 0.59rem;
        letter-spacing: 1.1px;
        white-space: nowrap;
      }

      .dot {
        padding: 0 3px;
      }

      .coming {
        margin-top: 22px;
        padding: 11px 23px;
        font-size: 0.68rem;
        letter-spacing: 4px;
      }

      .horizon-container {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 26svh;
        min-height: 150px;
        overflow: hidden;
      }

      .horizon {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 150%;
        min-width: 0;
        max-width: none;
        height: auto;
      }

      .footer {
        bottom: 10px;
        font-size: 0.62rem;
      }
    }

    /* SHORT MOBILE SCREENS */

    @media (max-width: 600px) and (max-height: 750px) {

      .content {
        padding-top: 15px;
      }

      .logo {
        width: 38vw;
        max-width: 165px;
      }

      .brand {
        font-size: 2.7rem;
      }

      .tagline {
        margin-top: 12px;
        font-size: 1.05rem;
      }

      .message {
        margin-top: 10px;
        font-size: 0.82rem;
      }

      .values {
        margin-top: 13px;
        font-size: 0.53rem;
      }

      .coming {
        margin-top: 15px;
        padding: 9px 20px;
      }

      .horizon-container {
        height: 24svh;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <div class="content">

      <img
        src="Logo.png"
        class="logo"
        alt="NabZap logo"
      >

      <div class="brand">
        <span class="nab">Nab</span><span class="zap">Zap</span>
      </div>

      <div class="tagline">
        Opportunities. Fast action.
      </div>

      <div class="message">
        We spot opportunities, act decisively,
        and build for lasting value.
      </div>

      <div class="values">
        SMART SOURCING
        <span class="dot">•</span>
        FAST ACTION
        <span class="dot">•</span>
        LASTING VALUE
      </div>

      <div class="coming">
        COMING SOON
      </div>

    </div>

    <!-- EARTH HORIZON -->
    <div class="horizon-container">
      <img
        src="Hz.png"
        class="horizon"
        alt=""
      >
    </div>

    <footer class="footer">
      © 2026 NABZAP LLC
    </footer>

  </main>

</body>
</html>
