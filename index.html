<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NABZAP | Coming Soon</title>
  <meta name="description" content="NABZAP — Something exciting is on the way.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 122, 0, 0.12), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255, 190, 60, 0.08), transparent 35%),
        #090b10;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .container {
      padding: 40px 25px;
      max-width: 900px;
    }

    .brand {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 900;
      letter-spacing: -5px;
      line-height: 0.9;
    }

    .brand span {
      color: #ff7a00;
    }

    .tagline {
      margin-top: 30px;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .message {
      margin: 22px auto 0;
      max-width: 600px;
      color: #aeb4c0;
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .coming {
      display: inline-block;
      margin-top: 38px;
      padding: 12px 24px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50px;
      color: #ff9b3d;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .footer {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      color: #555c68;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="brand">NAB<span>ZAP</span></div>

    <div class="tagline">
      Something exciting is on the way.
    </div>

    <div class="message">
      We spot opportunities. We move fast.<br>
      And we're just getting started.
    </div>

    <div class="coming">
      COMING SOON
    </div>
  </main>

  <footer class="footer">
    © 2026 NABZAP
  </footer>

</body>
</html>
