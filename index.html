    .content {

      z-index: 3;

    .zap {
      color: #d9a63c;

    .tagline {

      font-weight: 700;

    .message {

      margin: 18px auto 0;

    .values {
      margin-top: 24px;

      color: #d9a63c;

      text-transform: uppercase;

    .dot {
      color: #6f7888;

    }

      border-radius: 50px;

      color: #d9a63c;

      font-size: 0.8rem;
      font-weight: 700;

      letter-spacing: 5px;
    }

      min-width: 900px;
    }
